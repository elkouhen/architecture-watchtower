  - ["trendshift", "Trendshift live trending GitHub repositories", "discovery", "https://trendshift.io/", ["open-source","ai-agents","cloud","devops","ai-infrastructure"], "daily", "low", "https://trendshift.io/", "2026-08-29", "2026-08-29", "unknown", "ok", "Utiliser pour la fraîcheur et l’accélération ; confirmer chaque projet dans son dépôt primaire. Filtrer les dépôts suspects, vides ou sans utilité architecturale."]
