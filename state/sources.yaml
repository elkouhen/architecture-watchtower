# Registre local des sources de veille.
# Les sources de découverte servent à trouver un sujet ; une source primaire doit confirmer les faits importants.
schema_version: 2

# Chaque radar doit contrôler toutes les voies ci-dessous. Les listes référencent
# des identifiants du catalogue `sources`; une source peut couvrir plusieurs voies.
coverage_requirements:
  AWS:
    releases_features: [aws-whats-new, aws-bedrock-history]
    security: [aws-security-bulletins]
    lifecycle_deprecations: [aws-eks-lifecycle, aws-bedrock-history]
    availability_quotas_costs: [aws-whats-new, aws-bedrock-history]
  GCP:
    releases_features: [gcp-release-notes, gke-release-notes, vertex-ai-release-notes]
    security: [gcp-security-bulletins, gke-security-bulletins]
    lifecycle_deprecations: [gcp-deprecation-policy, gke-release-notes, vertex-ai-release-notes]
    availability_quotas_costs: [gcp-release-notes, vertex-ai-release-notes]
  IA:
    releases_features: [aws-bedrock-history, vertex-ai-release-notes, openai-api-changelog, anthropic-release-notes]
    security: [aws-security-bulletins, gcp-security-bulletins]
    lifecycle_deprecations: [aws-bedrock-history, vertex-ai-release-notes, openai-api-deprecations, anthropic-release-notes]
    availability_quotas_costs: [aws-bedrock-history, vertex-ai-release-notes, openai-api-changelog, anthropic-release-notes]

