  identity_key: pki:cve-2026-111943:emudhra-subca-compromise
  name: Compromission des sous-CA eMudhra (CVE-2026-111943)
  canonical_url: https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-071
  nature: standard
  novelty: Nouveau hors OSS
  origin: GCP
  subject: 'Clés privées de sous-CA eMudhra (emSign) compromises : magasins de confiance
    des nœuds et des conteneurs applicatifs à mettre à jour'
  product_version: GKE COS ≥ 1.37.1-gke.3011000 / 1.36.5-gke.1817000 / 1.35.9-gke.1390000
    / 1.34.12-gke.1508000 / 1.33.13-gke.2152000 ; trust bundles AWS
  environment: exposition inconnue (images applicatives et magasins de confiance non
    inventoriés)
  impact_architectural: 4
  urgence: 4
  pertinence_stack: 4
  confiance: 4
  recency: 30d
  coverage_lanes:
  - GCP/security
  - AWS/security
  scoring_note: 'Impact 4 : la confiance TLS externe des nœuds, des webhooks sans
    caBundle et des conteneurs applicatifs est touchée, sans rupture du mTLS interne.
    Urgence 4 : MitM actif possible tant que la CA reste approuvée. Pertinence 4 :
    Kubernetes et pipelines d’images sur AWS/GCP. Confiance 4 : bulletins GKE (23/10,
    mis à jour le 27/10) et AWS (25/10) distincts.'
  fact: 'GCP-2026-071 (23/10/2026, mis à jour le 27/10) : plusieurs clés privées de
    sous-CA eMudhra (emSign) ont été compromises (CVE-2026-111943). Les clients TLS
    non corrigés sont exposés à une interception MitM sur les connexions externes
    ; les conteneurs applicatifs n’héritent pas du magasin de confiance du nœud et
    doivent être mis à jour séparément. AWS a publié le bulletin 2026-150-AWS sur
    ses trust bundles le 25/10.'
  analysis: 'La correction est partagée : le fournisseur traite nœuds et composants
    système, l’équipe applicative doit reconstruire les images (ca-certificates, runtimes
    Go/Java). Les webhooks externes sans caBundle explicite dépendent du magasin système.'
  unknowns: Images de base utilisées, fréquence de reconstruction, webhooks d’admission
    externes sans caBundle.
  maturity: Correctifs GKE COS et Ubuntu publiés ; mises à jour des trust bundles
    AWS annoncées.
