  identity_key: gcp:gke:in-place-node-upgrade-default
  name: GKE — mise à niveau des nœuds en place
  canonical_url: https://docs.cloud.google.com/kubernetes-engine/docs/release-notes#October_16_2026
  nature: service
  novelty: Nouveau hors OSS
  origin: GCP
  subject: Les pools CPU GKE Standard peuvent être mis à niveau en réutilisant la
    VM existante lorsque maxUnavailable > 0
  product_version: Toutes versions GKE (Standard, pools CPU)
  environment: exposition inconnue (stratégies de surge des pools non inventoriées)
  impact_architectural: 3
  urgence: 3
  pertinence_stack: 4
  confiance: 4
  recency: 30d
  coverage_lanes:
  - GCP/lifecycle_deprecations
  scoring_note: 'Impact 3 : le mode d’exploitation des mises à niveau change (VM conservée,
    capacité préservée) sans contrat d’API modifié. Urgence 3 : comportement appliqué
    à toutes les versions, retrait uniquement via le support. Pertinence 4 : GKE est
    un environnement cible. Confiance 4 : note de version primaire datée.'
  fact: 'Note GKE du 16/10/2026 : pour les pools CPU GKE Standard, GKE peut désormais
    mettre à niveau un nœud en mettant à jour la VM Compute Engine existante au lieu
    de la recréer, ce qui conserve sa capacité. Le comportement s’active avec des
    surge upgrades dont maxUnavailable est supérieur à 0 ; il s’applique à toutes
    les versions et le retrait passe par Cloud Customer Care.'
  analysis: Le risque d’échec par manque de capacité baisse, mais les hypothèses «
    nœud neuf = disque et état neufs » des runbooks et des outils de durcissement
    doivent être revérifiées pour les pools concernés.
  unknowns: Pools configurés avec maxUnavailable > 0, dépendances à l’état local du
    nœud, exceptions documentées.
  maturity: Comportement GA appliqué par défaut ; exceptions décrites dans la documentation
    maxUnavailable.
  decision: qualify
