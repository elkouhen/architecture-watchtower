  id: candidate-001
  identity_key: linux:cve-2026-98432:ipv4-tcp-uaf-container-escape
  name: Noyau Linux — CVE-2026-98432 (TCP IPv4)
  canonical_url: https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-078
  nature: plateforme
  novelty: Nouveau hors OSS
  origin: GCP
  subject: Use-after-free TCP IPv4 du noyau permettant panique ou évasion de conteneur
    sur les nœuds GKE et AWS
  product_version: GKE COS < 1.36.5-gke.1982000 / 1.35.9-gke.1505000 / 1.34.12-gke.1539000
    / 1.33.13-gke.2207000 / 1.32.13-gke.2906000 ; 1.37 et Ubuntu en cours
  environment: exposition inconnue (versions GKE/EKS et images de nœuds non inventoriées)
  impact_architectural: 5
  urgence: 4
  pertinence_stack: 5
  confiance: 4
  recency: 7d
  coverage_lanes:
  - GCP/security
  - AWS/security
  scoring_note: 'Impact 5 : évasion de conteneur (root sur le nœud) depuis un processus
    non privilégié, donc rupture de l’isolation multi-tenant Kubernetes. Urgence 4
    : correctifs disponibles mais pas pour 1.37 ni Ubuntu, exploitation active non
    documentée, gravité Medium côté GKE. Pertinence 5 : Kubernetes est une priorité
    déclarée sur AWS et GCP. Confiance 4 : deux bulletins fournisseurs distincts (GKE
    04/11, AWS 31/10).'
  fact: 'GCP-2026-078 (04/11/2026) : CVE-2026-98432 dans la pile TCP IPv4 du noyau
    peut provoquer une panique ou une évasion de conteneur ; déclenchable localement
    sans CAP_NET_RAW ou à distance via des options IPv4 vers un listener du nœud ou
    du plan de contrôle. GKE Standard et Autopilot sont concernés ; correctifs COS
    publiés, 1.37 et Ubuntu en cours. AWS a publié le bulletin 2026-160-AWS le 31/10.'
  analysis: 'L’isolation par namespace ne suffit plus tant que le nœud n’est pas corrigé
    : les pools mutualisés exposant des listeners publics cumulent les deux vecteurs.
    Les réseaux autorisés du plan de contrôle et les règles de pare-feu réduisent
    le vecteur réseau mais pas le vecteur local.'
  unknowns: Versions GKE/EKS, type d’images (COS, Ubuntu, Bottlerocket, AL2023) et
    date de correctif 1.37/Ubuntu.
  maturity: Correctifs COS GA pour 1.32 à 1.36 ; 1.37 et Ubuntu annoncés en cours.
  decision: qualify
  owner: plateforme Kubernetes
  due_date: '2026-11-21'
  success_criterion: Inventaire des pools de nœuds GKE/EKS avec version et image ;
    pools non corrigés identifiés et planifiés.
