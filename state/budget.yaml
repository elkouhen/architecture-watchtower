# Budget de contexte du radar hebdomadaire. Aucun compteur de tokens n’est exposé par la
# session : le contrôle est a priori, sur la taille des fichiers lus par le modèle.
radar:
  unit: octets
  # Taille au-delà de laquelle `scripts/run_radar.rb` avertit qu’un brief ou le digest
  # doit être lu par sections plutôt qu’en une seule fois.
  max_brief_bytes: 120000
  note: "Le brief de qualification (prompt réduit, repères des notes, contexte compact) vise moins de 40 000 octets ; le digest hebdomadaire des deltas vise moins de 80 000 octets. Les lectures du cache sont ciblées par le digest (fichier et ligne)."
