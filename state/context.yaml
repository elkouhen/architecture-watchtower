# Contexte d’architecture de Mehdi — référence pour rendre la veille actionnable.
# Les champs inconnus doivent rester explicitement à qualifier dans les rapports.
clouds:
  - AWS
  - GCP
container_platform:
  product: Kubernetes
  version: unknown
  distributions: []
ci_cd:
  - GitHub Actions
  - GitLab CI/CD
observability:
  - CloudWatch
  - ELK
infrastructure_as_code:
  - Terraform

priority_topics:
  - ELK (Elasticsearch, Logstash, Kibana)
  - Elastic APM
  - Logstash
  - Kubernetes
  - IA appliquée aux architectures : trends, patterns, middlewares et bonnes pratiques

unknowns:
  - régions et comptes/projets utilisés
  - versions Kubernetes et providers Terraform
  - topologie des clusters et modes de déploiement
  - workloads critiques, volumes et débits
  - SLO, RPO/RTO et contraintes de coût
  - responsables opérationnels par plateforme

usage:
  - Relier chaque signal à un environnement concerné ou écrire `exposition inconnue`.
  - Proposer des étapes de déploiement compatibles AWS/GCP, Kubernetes, GitHub/GitLab et Terraform.
  - Prioriser les tests reproductibles et les preuves d’exploitation sur ces composants.
  - Traiter en priorité les évolutions qui concernent ELK, Elastic APM, Logstash ou Kubernetes.
  - Pour l’IA, relier chaque tendance à un cas d’usage, une architecture déployable, un middleware ou composant précis, un modèle d’exploitation, des contrôles de sécurité et un critère de décision.
