# Contexte d’architecture de Mehdi — référence pour rendre la veille actionnable.
# Les champs inconnus doivent rester explicitement à qualifier dans les rapports.
profile:
  role: "architecte Cloud/DevOps"
  objective: "maintenir et développer une expertise à jour sur les nouveautés qui transforment les plateformes, les architectures et leur exploitation"
  expectation: "détecter tôt les projets, patterns et services réellement intéressants, puis expliquer leur utilité et leur mise en œuvre"
clouds:
  - AWS
  - GCP
container_platform:
  product: Kubernetes
  version: unknown
  distributions: []
ci_cd:
  - GitHub Actions
  - GitLab CI/CD
observability:
  - CloudWatch
  - ELK
infrastructure_as_code:
  - Terraform

vendor_ecosystems:
  - name: HashiCorp
    products: [Terraform, Vault, Consul, Nomad, Boundary, Packer, Vagrant, Waypoint, HCP]
    interest: "suivre l’ensemble de l’écosystème, ses releases, advisories, lifecycle, intégrations et changements de licence"

priority_topics:
  - ELK (Elasticsearch, Logstash, Kibana)
  - Elastic APM
  - Logstash
  - Kubernetes
  - Écosystème HashiCorp : Terraform, Vault, Consul, Nomad, Boundary, Packer, Vagrant, Waypoint et HCP
  - IA appliquée aux architectures : trends, patterns, middlewares et bonnes pratiques

unknowns:
  - régions et comptes/projets utilisés
  - versions Kubernetes et providers Terraform
  - topologie des clusters et modes de déploiement
  - workloads critiques, volumes et débits
  - SLO, RPO/RTO et contraintes de coût
  - responsables opérationnels par plateforme

usage:
  - Considérer la veille comme un outil de maintien d’expertise, pas comme une simple revue d’actualité.
  - Donner la priorité aux nouveautés qui changent une décision d’architecture, un mode d’exploitation, un niveau de sécurité, un coût ou une capacité.
  - Faire remonter rapidement les signaux faibles à fort potentiel, en séparant explicitement découverte, maturité et recommandation.
  - Relier chaque signal à un environnement concerné ou écrire `exposition inconnue`.
  - Proposer des étapes de déploiement compatibles AWS/GCP, Kubernetes, GitHub/GitLab et Terraform.
  - Prioriser les tests reproductibles et les preuves d’exploitation sur ces composants.
  - Traiter en priorité les évolutions qui concernent ELK, Elastic APM, Logstash ou Kubernetes.
  - Pour l’IA, relier chaque tendance à un cas d’usage, une architecture déployable, un middleware ou composant précis, un modèle d’exploitation, des contrôles de sécurité et un critère de décision.
