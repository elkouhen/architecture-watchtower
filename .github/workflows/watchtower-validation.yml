name: Validation Architecture Watchtower

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Valider les registres et les index
        run: ruby scripts/validate_watchtower.rb --daily
